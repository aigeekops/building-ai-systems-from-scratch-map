<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>反向传播：梯度是怎么一层层传回去的 · Learn by Building</title>
<link rel="stylesheet" href="player.css">
<style>
  .edge{transition:stroke .3s,stroke-width .3s}
  .edge.on{stroke:#22d3ee;stroke-width:2.2}
  .edge.on2{stroke:#a78bfa;stroke-width:2.2}
  .stepbox{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body class="lesson" data-steps="8">
<div class="wrap">

  <div class="top">
    <a href="../index.html">← 学习地图</a>
    <span class="tag">UNIT 03 · MINI AUTOGRAD</span>
  </div>

  <div class="head">
    <h1>反向传播：梯度是怎么一层层传回去的</h1>
    <p class="sub">四个节点、一条链，把 <span class="num">∂L/∂L → ∂L/∂a → ∂L/∂w</span> 走一遍。数字与 <span class="num">units/03-mini-autograd</span> 里跑出来的一致。</p>
  </div>

  <div class="stage">
    <svg viewBox="0 0 980 470" role="img" aria-label="反向传播计算图">
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="#3b4557"/>
        </marker>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
        </marker>
      </defs>

      <text x="80" y="52" fill="#5b6577" font-size="10.5" letter-spacing=".12em">前向 · 值往右走　　反向 · 梯度往左走</text>

      <!-- 边 -->
      <g id="edges">
        <line id="e-xa" class="edge" x1="180" y1="136" x2="298" y2="212" stroke="#3b4557" stroke-width="1.4" marker-end="url(#a1)"/>
        <line id="e-wa" class="edge" x1="180" y1="316" x2="298" y2="240" stroke="#3b4557" stroke-width="1.4" marker-end="url(#a1)"/>
        <line id="e-al" class="edge" x1="410" y1="222" x2="538" y2="222" stroke="#3b4557" stroke-width="1.4" marker-end="url(#a1)"/>
        <line id="e-yl" class="edge" x1="595" y1="330" x2="595" y2="256" stroke="#3b4557" stroke-width="1.4" marker-end="url(#a1)"/>
      </g>

      <!-- 乘法因子标签（第 4 步） -->
      <text data-in="4" x="234" y="192" fill="#22d3ee" font-size="10.5" text-anchor="middle" font-family="ui-monospace,monospace">× w</text>
      <text data-in="4" x="234" y="268" fill="#22d3ee" font-size="10.5" text-anchor="middle" font-family="ui-monospace,monospace">× x</text>

      <!-- 节点 -->
      <g id="nodes">
        <rect x="80" y="110" width="100" height="52" rx="9" fill="#131922" stroke="#2e3746"/>
        <text x="130" y="132" text-anchor="middle" fill="#e7eaf0" font-size="13">x</text>
        <text class="num" data-in="1" x="130" y="151" text-anchor="middle" fill="#22d3ee" font-size="12.5">1.0</text>

        <rect x="80" y="290" width="100" height="52" rx="9" fill="#131922" stroke="#2e3746"/>
        <text x="130" y="312" text-anchor="middle" fill="#e7eaf0" font-size="13">w</text>
        <text class="num" data-in="1" x="130" y="331" text-anchor="middle" fill="#a78bfa" font-size="12.5">0.5</text>

        <rect x="300" y="196" width="110" height="52" rx="9" fill="#131922" stroke="#2e3746"/>
        <text x="355" y="217" text-anchor="middle" fill="#e7eaf0" font-size="12.5">a = x·w</text>
        <text class="num" data-in="1" x="355" y="236" text-anchor="middle" fill="#c3cad6" font-size="12.5">0.5</text>

        <rect x="540" y="196" width="110" height="52" rx="9" fill="#131922" stroke="#2e3746"/>
        <text x="595" y="217" text-anchor="middle" fill="#e7eaf0" font-size="12.5">L = (a−y)²</text>
        <text class="num" data-in="1" x="595" y="236" text-anchor="middle" fill="#fbbf24" font-size="12.5">0.25</text>

        <rect x="540" y="330" width="110" height="52" rx="9" fill="#131922" stroke="#2e3746"/>
        <text x="595" y="351" text-anchor="middle" fill="#e7eaf0" font-size="12.5">y 标签</text>
        <text class="num" data-in="1" x="595" y="370" text-anchor="middle" fill="#818b9c" font-size="12.5">0.0</text>
      </g>

      <!-- 梯度徽章 -->
      <text id="g-l" class="num" data-in="2" x="595" y="276" text-anchor="middle" fill="#34d399" font-size="11.5">∂L/∂L = 1</text>
      <text id="g-a" class="num" data-in="3" x="355" y="276" text-anchor="middle" fill="#34d399" font-size="11.5">∂L/∂a = 1.00</text>
      <text id="g-x" class="num" data-in="4" x="130" y="186" text-anchor="middle" fill="#34d399" font-size="11.5">∂L/∂x = 0.50</text>
      <text id="g-w" class="num" data-in="4" x="130" y="366" text-anchor="middle" fill="#34d399" font-size="11.5">∂L/∂w = 1.00</text>

      <!-- 第 5 步：分叉累加 -->
      <g id="branch" data-in="5">
        <rect x="300" y="330" width="230" height="100" rx="10" fill="#1a1420" stroke="#4c3570" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="318" y="354" fill="#c4b5fd" font-size="11.5">如果 a 还被别处用了</text>
        <text x="318" y="376" fill="#a1a1aa" font-size="11" font-family="ui-monospace,monospace">∂L/∂a += 另一条路径的梯度</text>
        <text x="318" y="398" fill="#a1a1aa" font-size="11" font-family="ui-monospace,monospace">不是覆盖，是累加</text>
        <text x="318" y="418" fill="#7e6f9e" font-size="10.5">所以缓冲区必须先 zero_grad()</text>
      </g>

      <!-- 第 6 步：更新 -->
      <g id="upd" data-in="6">
        <rect x="670" y="110" width="270" height="104" rx="10" fill="#0f2a22" stroke="#1f5c46" stroke-width="1"/>
        <text x="690" y="134" fill="#7dd3b0" font-size="10.5" letter-spacing=".1em">参数更新</text>
        <text class="num" x="690" y="158" fill="#e7eaf0" font-size="12">w ← w − lr · ∂L/∂w</text>
        <text class="num" x="690" y="180" fill="#e7eaf0" font-size="12">0.5 − 0.1 × 1.0 = 0.4</text>
        <text x="690" y="202" fill="#7e9c8c" font-size="10.5">lr = 0.1，往梯度反方向挪一步</text>
      </g>

      <!-- 第 7 步：loss 曲线 -->
      <g id="curve" data-in="7">
        <rect x="670" y="240" width="270" height="190" rx="10" fill="#11161f" stroke="#1e2530" stroke-width="1"/>
        <text x="690" y="264" fill="#5b6577" font-size="10.5" letter-spacing=".08em">XOR · 3000 轮</text>
        <polyline points="690,300 710,342 735,376 765,396 805,406 850,411 900,413 920,414"
          fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="690" y="294" fill="#5b6577" font-size="10" font-family="ui-monospace,monospace">0.25</text>
        <text x="916" y="398" text-anchor="end" fill="#7dd3e8" font-size="10.5" font-family="ui-monospace,monospace">0.001</text>
        <text x="690" y="424" fill="#4b5464" font-size="10">epoch</text>
      </g>
    </svg>
  </div>

  <div class="hud">
    <div class="txt">
      <div class="stepno" id="stepno">01 / 08</div>
      <h2 id="ttl"></h2>
      <p id="say"></p>
    </div>
    <div class="ctl">
      <div class="btns">
        <button id="prev" type="button">上一步</button>
        <button id="next" type="button" class="primary">下一步 →</button>
        <button id="play" type="button">播放</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="foot">
    <span>数字来自 <span class="num">units/03-mini-autograd/examples/xor.py</span>（seed=42, 3000 轮）。</span>
    <span>← → 键可以走</span>
  </div>
</div>

<script type="application/json" id="script">
[
 {"t":"前向时，每个运算顺手记了两件事",
  "say":"算 <code>a = x·w</code> 的时候，除了得到 0.5，还记下了「a 是由 x 和 w 算出来的」。这张父子关系表就是计算图 —— 反向传播全靠它才知道梯度该发给谁、乘什么。"},
 {"t":"前向：把数字填进去",
  "say":"<code>x = 1.0</code>，<code>w = 0.5</code> → <code>a = 0.5</code>；标签 <code>y = 0</code> → <code>L = (0.5 − 0)² = 0.25</code>。这一遍只有值，没有任何梯度。"},
 {"t":"反向：先给自己发一个 1",
  "say":"<code>∂L/∂L = 1</code>。这是整条链的种子，后面每一个梯度都是它乘出来的。"},
 {"t":"到 a：局部导数 × 流进来的梯度",
  "say":"<code>L = (a − y)²</code>，所以 <code>∂L/∂a = 2(a − y) · ∂L/∂L = 1.0</code>。前面那项是这个节点自己的局部导数，后面那项是从上游流进来的 —— 链式法则在代码里就是这个长相。"},
 {"t":"再往前：乘法节点要交换两个操作数",
  "say":"<code>∂L/∂x = ∂L/∂a · w = 0.5</code>，<code>∂L/∂w = ∂L/∂a · x = 1.0</code>。注意乘的是<b>对方的</b>值，不是自己的。这一步几乎所有人第一次写都会记反。"},
 {"t":"一个节点被用两次，梯度是加不是盖",
  "say":"如果 a 还参与了别处的计算，它收到的是两条路径之和：<code>∂L/∂a += ...</code>。所以梯度缓冲区必须能累加，也必须在每轮开始时清零 —— <code>zero_grad()</code> 不是形式主义。"},
 {"t":"更新：往梯度的反方向挪一步",
  "say":"<code>w ← w − lr · ∂L/∂w = 0.5 − 0.1 × 1.0 = 0.4</code>。整个训练循环，就是把上面这几步重复 3000 次。"},
 {"t":"3000 轮之后",
  "say":"损失从 0.25 掉到 0.001。这一课没有魔法，只有链式法则被正确执行了 3000 次 —— 你自己 clone 下来跑 <code>examples/xor.py</code>，出来的就是这条曲线。"}
]
</script>

<script>
/* 边的高亮：第 2 步点 L，第 3 步点 a→L，第 4 步点两条输入的边 */
const eAl=document.getElementById('e-al');
const eXA=document.getElementById('e-xa');
const eWA=document.getElementById('e-wa');
document.body.addEventListener('transitionend',()=>{});
new MutationObserver(()=>{
  const n=+document.body.dataset.cur;
  eAl.classList.toggle('on', n>=3);
  eXA.classList.toggle('on2', n>=4);
  eWA.classList.toggle('on2', n>=4);
}).observe(document.body,{attributes:true,attributeFilter:['data-cur']});
</script>
<script src="player.js"></script>
</body>
</html>
